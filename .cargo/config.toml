[env]
# Must equal tauri.conf.json's bundle.macOS.minimumSystemVersion, which tauri build
# exports under this name. With the two different, every switch between `just
# dev-app` and any other build recompiles the C dependencies and everything built on
# them (docs/build-environment.md). `just toolchain-parity` checks that they agree.
MACOSX_DEPLOYMENT_TARGET = "10.13"

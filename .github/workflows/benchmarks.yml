name: Benchmarks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"
          save-if: true

      - name: Benchmark the base and the pushed commit
        env:
          BEFORE: ${{ github.event.before }}
        run: bun run scripts/bench-ab.ts "$BEFORE" "$RUNNER_TEMP/benchmark-passes"

      - name: Upload both passes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-passes
          path: ${{ runner.temp }}/benchmark-passes

name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_type == 'tag'
    strategy: &targets
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
            updater_targets: 'darwin-aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
            updater_targets: 'darwin-x86_64'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: ''
            updater_targets: 'linux-x86_64-appimage'
          - platform: 'windows-latest'
            args: ''
            rust_target: ''
            updater_targets: 'windows-x86_64-nsis windows-x86_64-msi'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - &linux-dependencies
        name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Installs bun at the mise.toml pin; rust is handled below by
      # dtolnay/rust-toolchain instead, per the comment on that step.
      - &mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.5
          install_args: bun
          # Same reason as the rust-cache below.
          cache_save: false

      - run: bun install --frozen-lockfile

      # This action does not read rust-toolchain.toml, but the repo has one, and
      # a rustup directory override outranks whatever this installs. Asking for
      # "stable" would install the cross-compile targets for stable and then
      # build on the pinned version, which does not have them. Keep the version
      # here in lockstep with rust-toolchain.toml and mise.toml.
      - &rust-toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust_target }}

      # Restore only: a cache saved from a tag ref is readable only by that
      # same tag, so saving here fills the shared budget with dead entries.
      # warm-cache saves what this restores, and the two steps' inputs other
      # than save-if and lookup-only must stay equal or every restore misses.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"
          shared-key: release-${{ matrix.rust_target || matrix.platform }}
          cache-bin: "false"
          save-if: "false"

      - id: build
        name: Build and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        continue-on-error: true
        env: &tauri-env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: &tauri-with
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          tauriScript: bunx tauri

      # Retrying in the same target directory can run a corrupt build-script
      # binary again instead of relinking it (docs/release.md). The listing is
      # the only record of that binary once the directory is gone.
      - name: Clear the failed build before retrying
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::The release build failed once and is retrying from a clean target directory."
          echo "::group::Build script binaries: size, then first 16 bytes"
          find src-tauri/target -path '*/build/*' -name 'build-script-build*' -type f ! -name '*.d' | while read -r f; do
            echo "$(wc -c < "$f") $f"
            head -c 16 "$f" | od -An -tx1
          done
          echo "::endgroup::"
          rm -rf src-tauri/target

      - name: Retry build and upload
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env: *tauri-env
        with: *tauri-with

      - name: Sign accepted updater artifacts
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_DARWIN_AARCH64_KEY: ${{ secrets.UPDATER_DARWIN_AARCH64_KEY }}
          UPDATER_DARWIN_AARCH64_PASSWORD: ${{ secrets.UPDATER_DARWIN_AARCH64_PASSWORD }}
          UPDATER_DARWIN_X86_64_KEY: ${{ secrets.UPDATER_DARWIN_X86_64_KEY }}
          UPDATER_DARWIN_X86_64_PASSWORD: ${{ secrets.UPDATER_DARWIN_X86_64_PASSWORD }}
          UPDATER_WINDOWS_X86_64_NSIS_KEY: ${{ secrets.UPDATER_WINDOWS_X86_64_NSIS_KEY }}
          UPDATER_WINDOWS_X86_64_NSIS_PASSWORD: ${{ secrets.UPDATER_WINDOWS_X86_64_NSIS_PASSWORD }}
          UPDATER_WINDOWS_X86_64_MSI_KEY: ${{ secrets.UPDATER_WINDOWS_X86_64_MSI_KEY }}
          UPDATER_WINDOWS_X86_64_MSI_PASSWORD: ${{ secrets.UPDATER_WINDOWS_X86_64_MSI_PASSWORD }}
          UPDATER_LINUX_X86_64_APPIMAGE_KEY: ${{ secrets.UPDATER_LINUX_X86_64_APPIMAGE_KEY }}
          UPDATER_LINUX_X86_64_APPIMAGE_PASSWORD: ${{ secrets.UPDATER_LINUX_X86_64_APPIMAGE_PASSWORD }}
        run: python3 scripts/updater-release.py prepare --upload ${{ matrix.updater_targets }}

      - name: Retain verified updater artifacts
        if: hashFiles('updater-output/release-input.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-${{ matrix.platform }}-${{ matrix.rust_target || 'x64' }}
          path: updater-output/
          if-no-files-found: error

      - name: Create portable archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos
          tar -czf trunk-macos-${{ matrix.rust_target }}.tar.gz *.app

      - name: Create portable archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd src-tauri/target/release/bundle/appimage
          tar -czf trunk-linux-x86_64.tar.gz *.AppImage

      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd src-tauri/target/release
          tar -czf trunk-windows-x86_64.tar.gz trunk.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trunk-${{ matrix.platform }}-${{ matrix.rust_target || 'x64' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.tar.gz
            src-tauri/target/**/release/*.tar.gz
          if-no-files-found: error

  # Compiles each target's dependencies on main and saves them where build can
  # restore them (docs/release.md). It runs build's setup steps unchanged,
  # because rust-cache keys on the toolchains and environment they leave.
  warm-cache:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    strategy: *targets
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *linux-dependencies

      - *mise

      - run: bun install --frozen-lockfile

      - *rust-toolchain

      # Lookup only: a miss builds from a clean target directory rather than
      # from an older entry, so nothing a past build left there is saved again.
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"
          shared-key: release-${{ matrix.rust_target || matrix.platform }}
          cache-bin: "false"
          lookup-only: "true"

      - name: Build without bundling to fill the cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: bunx tauri build ${{ matrix.args }} --no-bundle

  finalize-updater:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate the repository's pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify complete updater feed and hosted bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/updater-release.py finalize

  publish:
    needs: [build, finalize-updater]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  update-tap:
    needs: [publish]
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Tauri version
        id: tauri
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Download DMGs and compute checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release download "$TAG" --pattern "*.dmg" --dir ./dmgs
          echo "arm_sha256=$(shasum -a 256 ./dmgs/*_aarch64.dmg | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "intel_sha256=$(shasum -a 256 ./dmgs/*_x64.dmg | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Generate cask and push to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAURI_VERSION: ${{ steps.tauri.outputs.version }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/joaofnds/homebrew-tap.git" tap
          bash scripts/homebrew-cask.sh "$TAG" "$TAURI_VERSION" "$intel_sha256" "$arm_sha256" tap/Casks

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/trunk.rb" "Casks/trunk@${VERSION}.rb"
          git commit -m "Update trunk to ${TAG}, and pin trunk@${VERSION}"
          git push

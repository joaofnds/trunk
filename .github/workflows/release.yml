name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_type == 'tag'
    strategy: &targets
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: ''
          - platform: 'windows-latest'
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - &linux-dependencies
        name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Installs bun at the mise.toml pin; rust is handled below by
      # dtolnay/rust-toolchain instead, per the comment on that step.
      - &mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install_args: bun
          # Same reason as the rust-cache below.
          cache_save: false

      - run: bun install --frozen-lockfile

      # This action does not read rust-toolchain.toml, but the repo has one, and
      # a rustup directory override outranks whatever this installs. Asking for
      # "stable" would install the cross-compile targets for stable and then
      # build on the pinned version, which does not have them. Keep the version
      # here in lockstep with rust-toolchain.toml and mise.toml.
      - &rust-toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_target }}

      # Restore only: a cache saved from a tag ref is readable only by that
      # same tag, so saving here fills the shared budget with dead entries.
      # warm-cache saves what this restores, and the two steps' inputs other
      # than save-if and lookup-only must stay equal or every restore misses.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          shared-key: release-${{ matrix.rust_target || matrix.platform }}
          cache-bin: "false"
          save-if: "false"

      - id: build
        name: Build and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        continue-on-error: true
        env: &tauri-env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: &tauri-with
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          tauriScript: bunx tauri

      # Retrying in the same target directory can run a corrupt build-script
      # binary again instead of relinking it (docs/release.md). The listing is
      # the only record of that binary once the directory is gone.
      - name: Clear the failed build before retrying
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::The release build failed once and is retrying from a clean target directory."
          echo "::group::Build script binaries: size, then first 16 bytes"
          find src-tauri/target -path '*/build/*' -name 'build-script-build*' -type f ! -name '*.d' | while read -r f; do
            echo "$(wc -c < "$f") $f"
            head -c 16 "$f" | od -An -tx1
          done
          echo "::endgroup::"
          rm -rf src-tauri/target

      - name: Retry build and upload
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env: *tauri-env
        with: *tauri-with

      - name: Create portable archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos
          tar -czf trunk-macos-${{ matrix.rust_target }}.tar.gz *.app

      - name: Create portable archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd src-tauri/target/release/bundle/appimage
          tar -czf trunk-linux-x86_64.tar.gz *.AppImage

      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd src-tauri/target/release
          tar -czf trunk-windows-x86_64.tar.gz trunk.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trunk-${{ matrix.platform }}-${{ matrix.rust_target || 'x64' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.tar.gz
            src-tauri/target/**/release/*.tar.gz
          if-no-files-found: error

  # Compiles each target's dependencies on main and saves them where build can
  # restore them (docs/release.md). It runs build's setup steps unchanged,
  # because rust-cache keys on the toolchains and environment they leave.
  warm-cache:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    strategy: *targets
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *linux-dependencies

      - *mise

      - run: bun install --frozen-lockfile

      - *rust-toolchain

      # Lookup only: a miss builds from a clean target directory rather than
      # from an older entry, so nothing a past build left there is saved again.
      - id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          shared-key: release-${{ matrix.rust_target || matrix.platform }}
          cache-bin: "false"
          lookup-only: "true"

      - name: Build without bundling to fill the cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: bunx tauri build ${{ matrix.args }} --no-bundle

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"

  update-tap:
    needs: [publish]
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Tauri version
        id: tauri
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Download DMGs and compute checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release download "$TAG" --pattern "*.dmg" --dir ./dmgs
          echo "arm_sha256=$(shasum -a 256 ./dmgs/*_aarch64.dmg | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "intel_sha256=$(shasum -a 256 ./dmgs/*_x64.dmg | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Generate cask and push to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          TAURI_VERSION="${{ steps.tauri.outputs.version }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/joaofnds/homebrew-tap.git" tap

          # The cask body is identical for both files apart from the token, so
          # write it once through a function. A versioned cask whose contents
          # drift from the unversioned one would install something different
          # from what the same tag serves as latest.
          write_cask() {
            cat > "$1" << CASK
          # Generated by joaofnds/trunk release workflow. DO NOT EDIT.
          cask "$2" do
            version "${VERSION}"

            on_intel do
              sha256 "${intel_sha256}"
              url "https://github.com/joaofnds/trunk/releases/download/v${VERSION}/Trunk_${TAURI_VERSION}_x64.dmg"
            end
            on_arm do
              sha256 "${arm_sha256}"
              url "https://github.com/joaofnds/trunk/releases/download/v${VERSION}/Trunk_${TAURI_VERSION}_aarch64.dmg"
            end

            name "Trunk"
            desc "Desktop Git GUI"
            homepage "https://github.com/joaofnds/trunk"

            app "Trunk.app"
            binary "#{appdir}/Trunk.app/Contents/MacOS/trunk"

            postflight_steps do
              run "/usr/bin/xattr", args: ["-cr", "{{appdir}}/Trunk.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.joaofnds.trunk",
              "~/Library/Caches/com.joaofnds.trunk",
              "~/Library/WebKit/com.joaofnds.trunk",
            ]
          end
          CASK
          }

          # brew resolves `trunk@0.45.0` to Casks/trunk@0.45.0.rb, so the token
          # inside the file has to carry the version too or the name it is
          # installed by will not match the name it declares.
          write_cask tap/Casks/trunk.rb trunk
          write_cask "tap/Casks/trunk@${VERSION}.rb" "trunk@${VERSION}"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/trunk.rb" "Casks/trunk@${VERSION}.rb"
          git commit -m "Update trunk to ${TAG}, and pin trunk@${VERSION}"
          git push

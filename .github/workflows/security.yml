name: Security

# Advisories land independently of our commits, so this runs on a schedule
# rather than per-PR — a new CVE should not turn an unrelated pull request red.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  bun-audit:
    name: Bun Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.5
      - run: bun install --frozen-lockfile
      - run: bun audit

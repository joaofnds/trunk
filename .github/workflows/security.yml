name: Security

# Advisories land independently of our commits, so this runs on a schedule
# rather than per-PR — a new CVE should not turn an unrelated pull request red.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  bun-audit:
    name: Bun Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.2
      - run: bun install --frozen-lockfile
      - run: bun audit

name: Security

# Advisories land independently of our commits, so this runs on a schedule
# rather than per-PR — a new CVE should not turn an unrelated pull request red.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  bun-audit:
    name: Bun Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.11
      - run: bun install --frozen-lockfile
      - run: bun audit

project_name: "trunk"
default_status: "To Do"
statuses: ["To Do", "Shape", "Build", "Review", "Ship", "Done"]
labels: ["graph", "review", "diff", "ui", "perf", "a11y", "ci", "release"]
types: ["bug", "feature", "refactor", "chore", "docs", "spike"]
definition_of_done: ["just check passes — the full gate, not a narrower tier", "New or changed behavior has a test that fails without the change", "No new suppressions: lint/clippy allows, skipped tests, or check exclusions", "Docs describing the changed behavior are updated (docs/, and .claude/rules/commit-graph.md paths when the graph pipeline changed)", "QA verified by a different session than the implementer (move to In QA; QA moves to Done)"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "nvim"
auto_open_browser: true
default_port: 54321
remote_operations: false
auto_commit: false
filesystem_only: true
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "TRUNK"

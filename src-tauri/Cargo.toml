[package]
name = "trunk"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trunk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Test-only affordances compiled out of the shipped binary. `StoreEvents::sync`
# and its companions let a test wait on what the event feed did instead of on a
# clock; nothing in the app calls them. Off by default, and enabled for the test
# and bench targets below, following tokio's `test-util` convention — `cfg(test)`
# cannot serve this, because the suites in `tests/` are separate crates that
# compile this one as an ordinary dependency.
test-util = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { workspace = true }
notify = "8"
notify-debouncer-mini = "0.7"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
comrak = "0.54"
ammonia = "4"
# Already in the tree via syntect; used here to parse markdown front matter into a
# diffable key/value table. Pinned to the version syntect resolves so nothing new
# is pulled in.
yaml-rust = "0.4"
tokio = { version = "1", features = ["process", "io-util"] }
libc = "0.2"
similar = { version = "3.1", features = ["unicode", "inline"] }
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = "0.5"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
# Already compiled in the tree (three versions resolve today); declaring it adds
# no new compiled dependency, which is why id minting samples it directly.
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
# AttachConsole for the `trunk review` argv branch: the release binary is
# windows_subsystem = "windows", so an interactive invocation has no console
# until it attaches to its parent's.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSResponder",
  "NSView",
  "NSControl",
  "NSButton",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
  "NSNotification",
  "NSOperation",
  "NSString",
  "block2",
] }
block2 = "0.6"

[dev-dependencies]
# Depend on ourselves with the feature on: the documented way to enable a
# crate's own feature for its test targets only.
trunk = { path = ".", features = ["test-util"] }
tauri = { version = "2", features = ["test"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bench_graph"
harness = false

[[bench]]
name = "bench_commands"
harness = false

[[bench]]
name = "bench_ipc"
harness = false

[workspace]
members = ["fixtures"]

[workspace.dependencies]
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }

# Every clippy lint is denied except the ones listed below, and the exceptions
# live here rather than as `#[allow]` in the source. An allow next to code reads
# as permission to add another one; a manifest entry has to be argued for.
#
# Each exception names the constraint that makes the lint unsatisfiable, not a
# preference. Delete one and fix the code the moment its constraint goes away.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Tauri owns these signatures. A command's arguments are deserialized by value
# and its injected state arrives by value, so neither can become a reference.
# Serde's `skip_serializing_if` predicates must take `&T` for the same reason,
# in the opposite direction.
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"

# A command's parameter list is its wire contract with the frontend plus the
# state Tauri injects by type. Neither half can be grouped into a struct without
# changing one of them, so the count is not the author's to choose. This
# replaces five `#[allow]`s that said the same thing next to the code.
too_many_arguments = "allow"

# The one site is the merge-edge ladder in `placement.rs`, whose `if parent_col
# < col` line is the anchor for three rows of the commit-graph mutation ledger,
# each carrying a measured verdict. Rewriting it as `match` would invalidate
# those anchors and the evidence behind them, which the graph rules treat as the
# record rather than as code to reformat.
comparison_chain = "allow"

# `GraphCommit`'s five flags are the IPC contract: the frontend reads them by
# name and the committed graph goldens pin them. Folding them into a bitfield or
# an enum changes the JSON both sides agree on, for no gain to either.
struct_excessive_bools = "allow"

# Two sites, and no third: TRUNK-157 split the other eight this lint found.
#
# `configure` in `lib.rs` is 130 lines, of which 121 are one `generate_handler!`
# invocation listing one command per line. Tauri cannot split it: `invoke_handler`
# stores a single closure and a second call replaces the first, and the macro's
# fall-through arm takes `Invoke` by value, so two generated handlers cannot be
# chained. Whatever function holds that list is over the limit by construction.
#
# `assign_lanes` in `git/placement.rs` is 231 lines, and 30 of the commit-graph
# mutation ledger's 65 anchors are exact source lines inside it, each carrying a
# measured killed/survives verdict. Extracting those lines invalidates the anchors
# and the evidence behind them. Splitting it is its own task, with the re-anchor
# and re-measure the graph rules require; it is not a lint fix.
#
# A third site means splitting it, not adding it here.
too_many_lines = "allow"


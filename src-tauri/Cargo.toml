[package]
name = "trunk"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trunk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Test-only affordances compiled out of the shipped binary. `StoreEvents::sync`
# and its companions let a test wait on what the event feed did instead of on a
# clock; nothing in the app calls them. Off by default, and enabled for the test
# and bench targets below, following tokio's `test-util` convention — `cfg(test)`
# cannot serve this, because the suites in `tests/` are separate crates that
# compile this one as an ordinary dependency.
test-util = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }
notify = "8"
notify-debouncer-mini = "0.7"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
comrak = "0.54"
ammonia = "4"
# Already in the tree via syntect; used here to parse markdown front matter into a
# diffable key/value table. Pinned to the version syntect resolves so nothing new
# is pulled in.
yaml-rust = "0.4"
tokio = { version = "1", features = ["process", "io-util"] }
libc = "0.2"
similar = { version = "3.1", features = ["unicode"] }
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = "0.5"
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
# Already compiled in the tree (three versions resolve today); declaring it adds
# no new compiled dependency, which is why id minting samples it directly.
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
# AttachConsole for the `trunk review` argv branch: the release binary is
# windows_subsystem = "windows", so an interactive invocation has no console
# until it attaches to its parent's.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSResponder",
  "NSView",
  "NSControl",
  "NSButton",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
  "NSNotification",
  "NSOperation",
  "NSString",
  "block2",
] }
block2 = "0.6"

[dev-dependencies]
# Depend on ourselves with the feature on: the documented way to enable a
# crate's own feature for its test targets only.
trunk = { path = ".", features = ["test-util"] }
tauri = { version = "2", features = ["test"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bench_graph"
harness = false

[[bench]]
name = "bench_commands"
harness = false

[[bench]]
name = "bench_ipc"
harness = false

